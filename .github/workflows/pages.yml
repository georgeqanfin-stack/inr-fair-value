name: pages

# Publishes the monitor to GitHub Pages: the dashboard as the front page, with the
# monthly note, full report, refresh summary and method documents beside it
# (src/inrfv/site.py). Runs after each monthly refresh (called from
# monthly-refresh.yml, since a push made by a workflow does not start other
# workflows), on pushes that change what the site shows, and by hand.

on:
  push:
    branches: [main]
    paths:
      - "reports/latest/**"
      - "docs/**"
      - "src/inrfv/site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main        # after a refresh, the commit it just pushed
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-site.txt
      - run: python -m inrfv.site --out _site
        env:
          PYTHONPATH: src
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
