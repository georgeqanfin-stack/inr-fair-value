name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt && pip install -e .
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt && pip install -e .
      - name: Tests with coverage (fails below the threshold in pyproject.toml)
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --build-arg GIT_REVISION=$(git rev-parse --short HEAD) -t inrfv .
      - name: Test suite inside the image
        run: docker run --rm inrfv python -m pytest -q
