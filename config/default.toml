# INR/USD fair value pipeline configuration.
# Every modelling assumption lives here so a run is fully described by
# (code version, this file, data/raw checksums). The run manifest records all three.

[paths]
raw        = "data/raw"
fred_cache = "data/raw/fred"
dbie_cache = "data/raw/dbie"
manual     = "data/raw/manual"
runs       = "outputs/runs"

[sample]
start = "2000-01-01"

# FRED series id -> panel column. Fetched from the API when FRED_API_KEY is set,
# otherwise from the public fredgraph CSV endpoint; cached under paths.fred_cache.
[fred.series]
cpi_us            = "CPIAUCSL"
fed_funds_rate    = "FEDFUNDS"
dxy_broad         = "DTWEXBGS"         # Fed broad dollar index, starts 2006
dxy_major         = "DTWEXM"           # Fed major-currency index, used only to backfill pre-2006 (ratio-spliced)
vix               = "VIXCLS"
us_10y_yield      = "GS10"
brent             = "DCOILBRENTEU"
fed_balance_sheet = "WALCL"
india_stir        = "IRSTCI01INM156N"  # India immediate (call money) rate, OECD MEI
cpi_india_oecd    = "INDCPIALLMINMEI"  # OECD CPI total for India, ends Mar 2025
inr_usd_fred      = "EXINUS"           # INR per USD, Fed H.10 monthly average; patches gaps in the RBI rate

# How to collapse higher-frequency FRED data to months. Market series use monthly
# averages to match the RBI monthly-average INR/USD rate.
[fred.monthly_agg]
dxy_broad         = "mean"
dxy_major         = "mean"
vix               = "mean"
brent             = "mean"
fed_balance_sheet = "last"

# RBI DBIE series. "merge": RBIH Data API (https://data-api.dbie.rbihub.in, a read-only
# mirror of DBIE's SDMX series run by the Reserve Bank Innovation Hub) combined with the
# DBIE Excel files in data/raw, API preferred where both exist; "api": API only;
# "xlsx": Excel files only. API responses are cached in paths.dbie_cache; --refresh re-fetches.
[dbie]
mode                 = "merge"
base_url             = "https://data-api.dbie.rbihub.in"
reconcile_rel_tol    = 0.005   # sources "agree" within 0.5%
revision_window      = 24      # months at the end of the older source where RBI revisions are expected
extend_inr_with_fred = true    # extend INR/USD past RBI's last month with rescaled FRED EXINUS

# Slow-moving monthly levels (REER, NEER, reserves, exports, imports) keep their latest
# published value for up to this many months when a release is late.
[pit]
carry_forward_months = 2

[dxy_splice]
overlap_months = 12   # ratio of broad/major over the first N overlapping months

[worldbank]
gdp_india_usd   = ["IN", "NY.GDP.MKTP.CD", "wb_gdp_india.csv"]
remittances_usd = ["IN", "BX.TRF.PWKR.CD.DT", "wb_remittances.csv"]
# REER anchor fundamentals (annual).
gdp_pc_ppp_india = ["IND", "NY.GDP.PCAP.PP.KD", "wb_gdp_pc_ppp_india.csv"]
gdp_pc_ppp_world = ["WLD", "NY.GDP.PCAP.PP.KD", "wb_gdp_pc_ppp_world.csv"]
tot_india        = ["IND", "TT.PRI.MRCH.XD.WD", "wb_tot_india.csv"]

[cpi_india]
# "official": MOSPI CPI-Combined, expressed on base 2024 = 100:
#   2025+      CPI 2024 = 100 (data/raw/manual/mospi_cpi_2024base.csv)
#   2013-2024  CPI 2012 = 100 x MOSPI's official linking factor (Combined, general index)
#   2011-2012  MOSPI's 2012-base back series, ratio-linked over the Jan-May 2013 overlap
#   2000-2010  CPI-IW (Labour Bureau), month-on-month changes chained backwards
# "oecd": the OECD MEI CPI for India (FRED INDCPIALLMINMEI, ends Mar 2025) ratio-spliced to MOSPI 2024.
source                 = "official"
linking_factor_2024    = 0.5267   # MOSPI, CPI 2024 series release (12 Feb 2026), Combined general index
cpiiw_factor_1982_2001 = 4.63     # Labour Bureau linking factor, CPI-IW 1982 -> 2001 base

[rates]
# The legacy notebooks used INTDSRINM193N, which is the IMF *discount rate* (Bank Rate),
# not the repo rate. Default: the overnight call rate for India, matching the overnight
# Fed funds rate on the US side, and available for the whole sample.
# "repo" uses data/raw/manual/rbi_policy_repo_rate.csv (RBI Handbook Table 40), which
# starts in Jun 2008; months before that fall back to the call rate and are reported.
india_policy_source = "india_stir"   # "india_stir", "repo" or "wacr" (RBI weighted average call rate, DBIE)
repo_file           = "rbi_policy_repo_rate.csv"

[data_checks]
# Flat runs in manual series that have been checked against the official source.
# Format "series:first-month:last-month".
verified_flat_runs = ["mospi_cpi:2025-08:2025-10"]   # MOSPI Aug 2026 release, Annexure IV

# Publication lags in months: a value for reference month m is treated as known
# at the end of month m + lag. Quarterly BoP data are stamped at the quarter's
# first month, so lag 6 = quarter end + 3 months.
[publication_lag]
inr_usd            = 0
reer               = 1
neer               = 1
fx_reserves_usd_mn = 0
dxy                = 0
vix                = 0
brent              = 0
fed_funds_rate     = 0
us_10y_yield       = 0
fed_balance_sheet  = 0
india_policy_rate  = 0
cpi_us             = 1
cpi_india          = 1
exports_usd_mn     = 1
imports_usd_mn     = 1
fpi_usd_mn         = 2
fdi_usd_mn         = 2
bop_quarterly      = 6
annual_worldbank   = 7   # months after December of the reference year (July Y+1)

[gdp]
# Nominal INR GDP beyond the last published year is extrapolated at the average
# growth of the last N published years, using only years public at each date.
growth_lookback_years = 3

[models.structural]
hp_lambda = 129600
min_obs   = 36          # months of REER history before the one-sided HP trend is used

[models.feer]
# Current-account norm (% of GDP) used for the central estimate:
#   "imf"    IMF EBA CA norm for India, FY2024/25: -2.0, s.e. 0.7
#            (IMF Country Report No. 25/314, 2025 Article IV, external sector assessment)
#   "niip"   CA that keeps NIIP/GDP at its current level: n * g / (1 + g)
#   "static" legacy v0.2 assumption
central_norm      = "imf"
imf_norm          = -2.0
imf_norm_se       = 0.7
static_norm       = -2.5
niip_growth_years = 5
# CA semi-elasticity to the REER = -(eta_exports * X/GDP + eta_imports * M/GDP) / 100,
# goods + services, trailing 4 quarters. Volume elasticities from IMF EBA-Lite 3.0.
eta_exports              = 0.46
eta_imports              = 0.25
eta_uncertainty          = 0.5     # +/-50% uniform in the Monte Carlo band
fallback_semi_elasticity = -0.16   # only if gross trade flows are unavailable ([dbie] mode "xlsx")
oil_norm_months  = 60              # Brent norm = trailing mean over this many months
window_quarters  = 4
carry_quarters   = 2               # carry trade shares and NIIP/GDP forward when the latest quarter is not out
band_draws       = 2000
band_percentiles = [10, 50, 90]
seed             = 7

[models.reer_anchor]
# log REER = c + b1*relative productivity + b2*log terms of trade + b3*NFA/GDP, dynamic OLS.
min_quarters          = 32     # 8 years of quarters before the first estimate
dols_k                = 1      # leads and lags of the differenced regressors
hac_lags              = 4
worldbank_release_lag = 7      # months after December until World Bank GDP per capita is public
tot_release_lag       = 18     # the WDI terms-of-trade series is published with a longer delay
band_draws            = 2000
band_percentiles      = [10, 90]
seed                  = 11

[panel]
# Panel REER anchor: India and peer emerging markets with floating or managed-floating
# regimes. Excluded: hard pegs (SAU, ARE, HKG), Argentina (hyperinflation breaks),
# Russia (2022 sanctions break), Taiwan (not in World Bank WDI).
countries = ["IND", "CHN", "BRA", "MEX", "IDN", "TUR", "ZAF", "KOR", "THA", "MYS",
             "PHL", "CHL", "COL", "PER", "POL", "HUN", "CZE", "ISR", "ROU"]
[panel.iso2]
IND = "IN"
CHN = "CN"
BRA = "BR"
MEX = "MX"
IDN = "ID"
TUR = "TR"
ZAF = "ZA"
KOR = "KR"
THA = "TH"
MYS = "MY"
PHL = "PH"
CHL = "CL"
COL = "CO"
PER = "PE"
POL = "PL"
HUN = "HU"
CZE = "CZ"
ISR = "IL"
ROU = "RO"

[panel.indicators]
gdp_pc_ppp = "NY.GDP.PCAP.PP.KD"   # relative productivity = log(country / world)
tot        = "TT.PRI.MRCH.XD.WD"   # net barter terms of trade (WDI coverage starts 2005)
gov_cons   = "NE.CON.GOVT.ZS"      # government consumption, % of GDP
openness   = "NE.TRD.GNFS.ZS"      # exports + imports, % of GDP

[models.panel_anchor]
# Pooled dynamic OLS with country fixed effects, annual; standard errors clustered by country.
# "prod": relative productivity only (Balassa-Samuelson), the one specification whose
# residuals pass the panel cointegration check (Fisher p = 0.025 after trying 12 variants,
# so treat it as suggestive); "long" adds government consumption and openness (1995+);
# "short" adds terms of trade (2005+, WDI coverage). All three are reported every run.
central_spec   = "prod"
dols_k         = 1
min_years      = 10         # minimum usable years before the first estimate
release_lag    = 7          # months after December until WDI annual data are public
tot_release_lag = 18
reer_lag       = 1          # months until a month's BIS REER is public
band_draws     = 2000
band_percentiles = [10, 90]
seed           = 13

[models.panel_anchor.specs]
prod  = ["rel_prod"]
long  = ["rel_prod", "gov_cons", "openness"]
short = ["rel_prod", "log_tot", "gov_cons", "openness"]

[models.beer]
regressors = ["log_dxy", "real_rate_diff", "fpi_pct_gdp", "log_brent", "vix"]
min_obs    = 60

[models.regimes]
min_obs     = 96
refit_every = 12
seed        = 42

[composite]
# REER component: "hp" (one-sided HP gap), "anchor" (India-only fundamentals anchor) or
# "panel" (panel anchor, pooled across emerging markets).
# All three are estimated and reported every run. Default "panel": the only one whose
# error-correction coefficient has the right sign in every out-of-sample window
# (see README, "REER component choice"). The India-only anchor fails cointegration.
reer_component = "panel"
weight_reer = 0.5
weight_feer = 0.5

[backtest]
horizons         = [1, 3, 6, 12]
min_train        = 60      # realised target observations before the first OOS forecast
headline_horizon = 12
