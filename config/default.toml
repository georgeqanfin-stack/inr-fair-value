# USD/INR fair value pipeline configuration.
# Every modelling assumption lives here so a run is fully described by
# (code version, this file, data/raw checksums). The run manifest records all three.

[publication]
author = "George P Babu, Quantitative Researcher"   # "Built and maintained by ..." on the dashboard and the site
refresh_day = 15          # day of the month the scheduled refresh runs (06:00 UTC); must match
                          # the cron in .github/workflows/monthly-refresh.yml (a test checks it)

[paths]
raw        = "data/raw"
fred_cache = "data/raw/fred"
dbie_cache = "data/raw/dbie"
manual     = "data/raw/manual"
runs       = "outputs/runs"

[sample]
start = "2000-01-01"

# FRED series id -> panel column. Fetched from the API when FRED_API_KEY is set,
# otherwise from the public fredgraph CSV endpoint; cached under paths.fred_cache.
[fred.series]
cpi_us            = "CPIAUCSL"
fed_funds_rate    = "FEDFUNDS"
dxy_broad         = "DTWEXBGS"         # Fed broad dollar index, starts 2006
dxy_major         = "DTWEXM"           # Fed major-currency index, used only to backfill pre-2006 (ratio-spliced)
vix               = "VIXCLS"
us_10y_yield      = "GS10"
brent             = "DCOILBRENTEU"
fed_balance_sheet = "WALCL"
india_stir        = "IRSTCI01INM156N"  # India immediate (call money) rate, OECD MEI
cpi_india_oecd    = "INDCPIALLMINMEI"  # OECD CPI total for India, ends Mar 2025
inr_usd_fred      = "EXINUS"           # INR per USD, Fed H.10 monthly average; patches gaps in the RBI rate

# How to collapse higher-frequency FRED data to months. Market series use monthly
# averages to match the RBI monthly-average USD/INR rate.
[fred.monthly_agg]
dxy_broad         = "mean"
dxy_major         = "mean"
vix               = "mean"
brent             = "mean"
fed_balance_sheet = "last"

# RBI DBIE series. "merge": RBIH Data API (https://data-api.dbie.rbihub.in, a read-only
# mirror of DBIE's SDMX series run by the Reserve Bank Innovation Hub) combined with the
# DBIE Excel files in data/raw, API preferred where both exist; "api": API only;
# "xlsx": Excel files only. API responses are cached in paths.dbie_cache; --refresh re-fetches.
[dbie]
mode                 = "merge"
base_url             = "https://data-api.dbie.rbihub.in"
reconcile_rel_tol    = 0.005   # sources "agree" within 0.5%
revision_window      = 24      # months at the end of the older source where RBI revisions are expected
extend_inr_with_fred = true    # extend USD/INR past RBI's last month with rescaled FRED EXINUS

# Slow-moving monthly levels (REER, NEER, reserves, exports, imports) keep their latest
# published value for up to this many months when a release is late.
[alfred]
# US CPI inflation from FRED's real-time archive (data/alfred.py): needs FRED_API_KEY the
# first time (then cached in data/raw/alfred). Without it the revised series is used.
enabled = true

[vintages]
# Re-run the headline on the earlier RBI vintage (DBIE Excel files) and report how much
# revisions moved each point-in-time reading (vintages.revision_effect).
revision_check = true

[pit]
carry_forward_months = 2

[dxy_splice]
overlap_months = 12   # ratio of broad/major over the first N overlapping months

[worldbank]
gdp_india_usd   = ["IN", "NY.GDP.MKTP.CD", "wb_gdp_india.csv"]
remittances_usd = ["IN", "BX.TRF.PWKR.CD.DT", "wb_remittances.csv"]
# REER anchor fundamentals (annual).
gdp_pc_ppp_india = ["IND", "NY.GDP.PCAP.PP.KD", "wb_gdp_pc_ppp_india.csv"]
gdp_pc_ppp_world = ["WLD", "NY.GDP.PCAP.PP.KD", "wb_gdp_pc_ppp_world.csv"]
gdp_pc_ppp_usa   = ["USA", "NY.GDP.PCAP.PP.KD", "wb_gdp_pc_ppp_usa.csv"]
tot_india        = ["IND", "TT.PRI.MRCH.XD.WD", "wb_tot_india.csv"]

[cpi_india]
# "official": MOSPI CPI-Combined, expressed on base 2024 = 100:
#   2025+      CPI 2024 = 100 (data/raw/manual/mospi_cpi_2024base.csv)
#   2013-2024  CPI 2012 = 100 x MOSPI's official linking factor (Combined, general index)
#   2011-2012  MOSPI's 2012-base back series, ratio-linked over the Jan-May 2013 overlap
#   2000-2010  CPI-IW (Labour Bureau), month-on-month changes chained backwards
# "oecd": the OECD MEI CPI for India (FRED INDCPIALLMINMEI, ends Mar 2025) ratio-spliced to MOSPI 2024.
source                 = "official"
linking_factor_2024    = 0.5267   # MOSPI, CPI 2024 series release (12 Feb 2026), Combined general index
cpiiw_factor_1982_2001 = 4.63     # Labour Bureau linking factor, CPI-IW 1982 -> 2001 base

[rates]
# The legacy notebooks used INTDSRINM193N, which is the IMF *discount rate* (Bank Rate),
# not the repo rate. Default: the overnight call rate for India, matching the overnight
# Fed funds rate on the US side, and available for the whole sample.
# "repo" uses data/raw/manual/rbi_policy_repo_rate.csv (RBI Handbook Table 40), which
# starts in Jun 2008; months before that fall back to the call rate and are reported.
india_policy_source = "india_stir"   # "india_stir", "repo" or "wacr" (RBI weighted average call rate, DBIE)
repo_file           = "rbi_policy_repo_rate.csv"

[data_checks]
# Flat runs in manual series that have been checked against the official source.
# Format "series:first-month:last-month".
verified_flat_runs = ["mospi_cpi:2025-08:2025-10"]   # MOSPI Aug 2026 release, Annexure IV

# Publication lags in months: a value for reference month m is treated as known
# at the end of month m + lag. Quarterly BoP data are stamped at the quarter's
# first month, so lag 6 = quarter end + 3 months.
[publication_lag]
inr_usd            = 0
reer               = 1
neer               = 1
fx_reserves_usd_mn = 0
dxy                = 0
vix                = 0
brent              = 0
fed_funds_rate     = 0
us_10y_yield       = 0
fed_balance_sheet  = 0
india_policy_rate  = 0
cpi_us             = 1
cpi_india          = 1
exports_usd_mn     = 1
imports_usd_mn     = 1
fpi_usd_mn         = 2
fdi_usd_mn         = 2
fwd_premium        = 0   # RBI inter-bank forward premia: market prices
rbi_intervention   = 2   # RBI Bulletin Table 4: month m appears around the 20th of m+2
bop_quarterly      = 6
annual_worldbank   = 7   # months after December of the reference year (July Y+1)

[gdp]
# Nominal INR GDP beyond the last published year is extrapolated at the average
# growth of the last N published years, using only years public at each date.
growth_lookback_years = 3

[models.structural]
hp_lambda = 129600
min_obs   = 36          # months of REER history before the one-sided HP trend is used

[models.feer]
# Current-account norm (% of GDP) used for the central estimate:
#   "imf_path" IMF EBA CA norms for India as published over time (data/raw/manual/imf_ca_norm_india.csv),
#              each applying from its publication month; before the first one, the first is used
#   "imf"      a single IMF norm (imf_norm, imf_norm_se) for every period
#   "niip"     CA that keeps NIIP/GDP at its current level: n * g / (1 + g)
#   "static"   legacy v0.2 assumption
central_norm      = "imf_path"
norm_path_file    = "imf_ca_norm_india.csv"
imf_norm          = -2.0
imf_norm_se       = 0.7
static_norm       = -2.5
niip_growth_years = 5
# CA semi-elasticity to the REER = -(eta_exports * X/GDP + eta_imports * M/GDP) / 100,
# goods + services, trailing 4 quarters. Volume elasticities from IMF EBA-Lite 3.0.
eta_exports              = 0.46
eta_imports              = 0.25
eta_uncertainty          = 0.5     # +/-50% uniform in the Monte Carlo band
fallback_semi_elasticity = -0.16   # only if gross trade flows are unavailable ([dbie] mode "xlsx")
# Income-balance term in the semi-elasticity (feer.semi): the share of net primary income
# fixed in foreign currency is unknown; central 0.5, drawn uniformly on [0, 1] in the bands.
income_term      = true
income_fc_share  = 0.5
# IMF EBA cyclical adjustment: CA effect of India's output gap relative to partners'.
cyclical_adjustment  = true
cyclical_coefficient = -0.3564      # EBA CA regression, relative output gap (EBA estimates tables)
oil_norm_months  = 60              # Brent norm = trailing mean over this many months
window_quarters  = 4
carry_quarters   = 2               # carry trade shares and NIIP/GDP forward when the latest quarter is not out
band_draws       = 2000
band_percentiles = [10, 50, 90]
seed             = 7

[models.reer_anchor]
# log REER = c + b1*relative productivity + b2*log terms of trade + b3*NFA/GDP, dynamic OLS.
min_quarters          = 32     # 8 years of quarters before the first estimate
dols_k                = 1      # leads and lags of the differenced regressors
hac_lags              = 4
worldbank_release_lag = 7      # months after December until World Bank GDP per capita is public
tot_release_lag       = 18     # the WDI terms-of-trade series is published with a longer delay
band_draws            = 2000
band_percentiles      = [10, 90]
seed                  = 11

[panel]
# Panel REER anchor: India and peer emerging markets with floating or managed-floating
# regimes. Excluded: hard pegs (SAU, ARE, HKG), Argentina (hyperinflation breaks),
# Russia (2022 sanctions break), Taiwan (not in World Bank WDI).
countries = ["IND", "CHN", "BRA", "MEX", "IDN", "TUR", "ZAF", "KOR", "THA", "MYS",
             "PHL", "CHL", "COL", "PER", "POL", "HUN", "CZE", "ISR", "ROU"]
[panel.iso2]
IND = "IN"
CHN = "CN"
BRA = "BR"
MEX = "MX"
IDN = "ID"
TUR = "TR"
ZAF = "ZA"
KOR = "KR"
THA = "TH"
MYS = "MY"
PHL = "PH"
CHL = "CL"
COL = "CO"
PER = "PE"
POL = "PL"
HUN = "HU"
CZE = "CZ"
ISR = "IL"
ROU = "RO"

[panel.indicators]
gdp_pc_ppp = "NY.GDP.PCAP.PP.KD"   # relative productivity = log(country / world)
tot        = "TT.PRI.MRCH.XD.WD"   # net barter terms of trade (WDI coverage starts 2005)
gov_cons   = "NE.CON.GOVT.ZS"      # government consumption, % of GDP
openness   = "NE.TRD.GNFS.ZS"      # exports + imports, % of GDP

[panel.nfa]
# Net foreign assets, % of GDP, from the External Wealth of Nations database (Lane &
# Milesi-Ferretti, Brookings; data/raw/ewn). "nfa_ewn": net IIP excl. gold, authors'
# estimates (consistent across countries, 1970+); "nfa_official": IIP as reported.
# Remove this table to drop NFA from the panel entirely.
measure = "nfa_ewn"

[peers]
# Known episodes for the peer check (models/peers.py), fixed before looking at results:
# the mean misalignment after the event should move towards "weaker" (undervaluation)
# after a sell-off, "stronger" after a sustained rally.
episodes = [
  {country = "TUR", label = "2018 lira crisis", before = ["2010-01", "2013-12"], after = ["2018-08", "2019-12"], expect = "weaker"},
  {country = "BRA", label = "2015 recession and real sell-off", before = ["2011-01", "2014-06"], after = ["2015-06", "2016-06"], expect = "weaker"},
  {country = "ZAF", label = "Dec 2015 rand sell-off", before = ["2011-01", "2012-12"], after = ["2015-12", "2016-12"], expect = "weaker"},
  {country = "MEX", label = "Nov 2016 peso fall", before = ["2013-01", "2014-12"], after = ["2016-11", "2017-06"], expect = "weaker"},
  {country = "MEX", label = "2023-24 'super peso' rally", before = ["2016-11", "2017-06"], after = ["2023-06", "2024-06"], expect = "stronger"},
  {country = "CHN", label = "Aug 2015 renminbi devaluation", before = ["2014-07", "2015-07"], after = ["2015-09", "2016-12"], expect = "weaker"},
  {country = "IND", label = "2013 taper tantrum", before = ["2012-01", "2013-04"], after = ["2013-08", "2013-12"], expect = "weaker"},
]

[models.panel_anchor]
# Pooled dynamic OLS with country fixed effects, annual; standard errors clustered by country.
# "prod": relative productivity only (Balassa-Samuelson), the one specification whose
# residuals pass the panel cointegration check (Fisher p = 0.025 after trying 12 variants,
# so treat it as suggestive); "long" adds government consumption and openness (1995+);
# "short" adds terms of trade (2005+, WDI coverage); "prod_nfa" adds net foreign assets.
# All are reported every run. NFA enters with the wrong sign and is insignificant
# (t -0.5 EWN, -0.7 official) and adding it breaks the panel cointegration check
# (Fisher p 0.42 EWN, 0.25 official), so it is a reported diagnostic, not central.
central_spec   = "prod"
dols_k         = 1
min_years      = 10         # minimum usable years before the first estimate
release_lag    = 7          # months after December until WDI annual data are public
tot_release_lag = 18
nfa_release_lag = 16        # EWN year-end y data appear around April of y+2
reer_lag       = 1          # months until a month's BIS REER is public
band_draws     = 2000
band_percentiles = [10, 90]
seed           = 13
# Formal panel cointegration (stats/panel_coint.py): bootstrap p-values under no
# cointegration for Pedroni-type and Westerlund tests, over the family of every
# specification containing the first candidate; Holm and BH adjustment of the primary
# statistic. Primary = Pedroni-type group ADF: correct size in a Monte Carlo
# (scripts/mc_panel_coint.py), where the Westerlund bootstrap over-rejected (15-18% at 5%).
coint_candidates = ["rel_prod", "gov_cons", "openness", "log_tot", "nfa"]
coint_primary    = "group_adf"
coint_reps       = 999     # p-values vary by about +/-0.01 across seeds even at 999; cached until annual data change

[models.panel_anchor.specs]
prod  = ["rel_prod"]
long  = ["rel_prod", "gov_cons", "openness"]
short = ["rel_prod", "log_tot", "gov_cons", "openness"]
prod_nfa = ["rel_prod", "nfa"]

[models.beer]
# Real USD/INR (PPP imposed) on long-run fundamentals, dynamic OLS; see models/beer.py.
central_spec          = "core"
dols_k                = 3        # months of leads and lags of the differenced regressors
hac_lags              = 12
min_obs               = 96       # months before the first estimate
refit_every           = 3        # re-estimate every 3 months
hp_lambda             = 129600   # permanent components for the "total" BEER
worldbank_release_lag = 7
band_draws            = 1000
band_percentiles      = [10, 90]
seed                  = 17

[models.beer.specs]
core  = ["log_dxy", "rel_prod", "real_rate_diff"]
dxy   = ["log_dxy"]
oil   = ["log_dxy", "rel_prod", "real_rate_diff", "log_brent"]
fwd   = ["log_dxy", "rel_prod", "real_fwd_diff"]   # market (forward-implied) real rate differential

[models.flows]
# Flow attribution (models/flows.py): monthly USD/INR % change on net FPI and FDI flows
# (US$ bn), dollar index and Brent % changes; Newey-West errors. Ex post, by reference
# month: explains spot moves, does not enter the fair value.
regressors = ["fpi", "fdi", "dxy", "brent"]
start      = "2011-01"      # RBI monthly FDI/FPI coverage on one basis
hac_lags   = 3
windows    = [3, 12]        # months summed in the attribution tables

[models.market]
# Forward premia (models/market.py): implied forwards, UIP test, spread over the policy gap.
hac_lags = 6

[uncertainty]
# Joint bootstrap corridor for the composite (models/uncertainty.py).
panel_boot_draws  = 300      # country-block bootstrap draws per panel re-estimation
draws             = 2000     # joint draws per month
ca_measurement_sd = 0.2      # current-account measurement/revision error, % of GDP (4-quarter sum)
weight_schemes    = ["equal", "performance", "inverse_variance"]
# Headline corridor: "bootstrap" (joint draws; ex-post coverage 75% vs nominal 80%, 2017-25,
# 66% after the v0.17 FEER changes, hence [uncertainty.recalibration])
# or "end_to_end" (the component bands joined end to end; coverage 100%, about twice as
# wide). Chosen after the coverage test, as the one closer to nominal; see docs/METHODOLOGY.md.
headline_corridor = "bootstrap"
seed              = 23

[uncertainty.recalibration]
# Conformal recalibration of the bootstrap corridor against its own ex-post misses
# (uncertainty.recalibrate). Candidates: "scale" widens both sides by one factor k;
# "shift_scale" also moves the centre by the mean past miss. Real time: a month uses
# only years whose IMF assessment (hence ex-post value) was published by then, and at
# least min_years of them; earlier months keep the raw corridor.
# Decision rule, set before computing the recalibrated corridors: judge on
# leave-one-year-out coverage; keep the raw corridor unless a candidate is closer to
# nominal; prefer "scale" (one parameter) unless "shift_scale" is closer by more than
# 5 pp. Real-time coverage is reported alongside.
enabled    = true
methods    = ["scale", "shift_scale"]
nominal    = 0.80
min_years  = 3
prefer_gap = 0.05

[models.nonlinear]
enabled        = true
# Nonlinear / time-varying ECM variants and break tests (models/nonlinear.py).
rolling_months = 120      # training window of the rolling ECM
min_rmse_gain  = 0.01     # rule: replace the linear ECM forecast only if a variant lowers the
                          # headline RMSE ratio by this much AND has a lower Clark-West p
robustness_windows = [72, 96, 120, 144, 180]
break_reps     = 199      # block-bootstrap replications for break-test p-values
break_block    = 12       # block length (months)
seed           = 29

[models.flow_id]
# Identification of the FPI effect (models/flow_id.py): recursive orderings, local
# projections and 2SLS with global push instruments.
start       = "2011-03"
lags        = 2
horizons    = 6
instruments = ["vix", "us10y"]

[models.regimes]
min_obs     = 96
refit_every = 12
seed        = 42

[models.regimes_tvtp]
# Time-varying transition probabilities (models/regimes_tvtp.py), tested against the
# constant model; the headline regime model switches only if a TVTP spec beats it out
# of sample (log score) with a one-sided p below switch_p.
min_obs     = 96
refit_every = 12
switch_p    = 0.10
seed        = 42

[composite]
# REER component: "hp" (one-sided HP gap), "anchor" (India-only fundamentals anchor) or
# "panel" (panel anchor, pooled across emerging markets).
# All three are estimated and reported every run. Default "panel": the only one whose
# error-correction coefficient has the right sign in every out-of-sample window
# (see docs/METHODOLOGY.md, "REER component choice"). The India-only anchor fails cointegration.
reer_component = "panel"
weight_reer = 0.5
weight_feer = 0.5
# Decision rule for the weights (models/weights.py), set before testing alternatives: keep
# equal weights unless a scheme lowers the headline-horizon RMSE ratio vs drift by at
# least min_rmse_gain AND has a lower Clark-West p-value.
weight_rule = {min_rmse_gain = 0.01}

[backtest]
horizons         = [1, 3, 6, 12]
min_train        = 60      # realised target observations before the first OOS forecast
headline_horizon = 12
# window_months = 120     # rolling ECM estimation window; unset = expanding (see docs/METHODOLOGY.md, item 7:
                          # the rolling window beats expanding at 120 months but not robustly)
