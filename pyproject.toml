[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inrfv"
version = "1.1.0"
description = "INR/USD hybrid fair value model (REER, FEER, BEER, regimes, ECM) with point-in-time backtesting"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14.4",
    "openpyxl>=3.1",
    "requests>=2.31",
    "fredapi>=0.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-requests"]
plots = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning:openpyxl"]

[tool.ruff]
line-length = 150   # report and note text are long f-string sentences; splitting them mid-sentence hurts readability
target-version = "py311"
extend-exclude = ["notebooks", "outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E731: small named lambdas are used deliberately for readability.
# E702: a few matplotlib one-liners use semicolons.
# B905: adding strict= to existing zip() calls could change behaviour; not worth the risk.
ignore = ["E731", "E702", "B905"]

[tool.coverage.run]
source = ["inrfv"]
omit = ["*/inrfv/report.py"]   # chart drawing; its text output is covered by end-to-end tests

[tool.coverage.report]
fail_under = 85

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
no_implicit_optional = true

[tool.ruff.lint.per-file-ignores]
# The dashboard embeds an HTML/CSS/JS template; wrapping it would hurt readability.
"src/inrfv/dashboard.py" = ["E501"]
